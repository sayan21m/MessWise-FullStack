services:
  postgres:
    image: postgres:17
    container_name: messwise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: messwise
      POSTGRES_PASSWORD: messwise_dev
      POSTGRES_DB: messwise
    ports:
      - "5432:5432"
    volumes:
      - messwise_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U messwise -d messwise"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  messwise_postgres_data:
